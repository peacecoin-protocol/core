# Full reference https://github.com/foundry-rs/foundry/tree/master/crates/config

[profile.default]
  auto_detect_solc = false
  # Profile-specific OZ versions; do not override these aliases in remappings.txt.
  remappings = [
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  ]
  block_timestamp = 1_680_220_800 # March 31, 2023 at 00:00 GMT
  bytecode_hash = "none"
  evm_version = "cancun"
  fuzz = { runs = 1_000 }
  gas_reports = ["*"]
  optimizer = true
  optimizer_runs = 200
  # Polygon PoS raised the contract code size limit to 32 KiB via PIP-30
  # (Ahmedabad hardfork, 2024-09-25). Foundry still defaults to EIP-170's
  # 24,576-byte limit, so we override here to match the chain.
  code_size_limit = 32768
  via_ir = true
  out = "out"
  script = "script"
  solc = "0.8.30"
  src = "src"
  test = "test"
  libs = ["node_modules", "lib"]
  ffi = true
  ast = true
  build_info = true
  extra_output = ["storageLayout"]
  # Validation reads artifacts; fork rehearsals write generated proposal JSON only under out/pip23.
  fs_permissions = [{ access = "read", path = "./out" }, { access = "read", path = "./out-governor-mainnet" }, { access = "read-write", path = "./out/pip23" }]

# Ethereum Governor must retain the verified production toolchain (OZ 5.0.2).
[profile.governor_mainnet]
  src = "governor-mainnet"
  test = "governor-mainnet-test"
  script = "governor-mainnet-script"
  out = "out-governor-mainnet"
  cache_path = "cache-governor-mainnet"
  solc = "0.8.26"
  code_size_limit = 24576
  evm_version = "shanghai"
  optimizer = true
  optimizer_runs = 10_000
  via_ir = true
  bytecode_hash = "none"
  cbor_metadata = true
  use_literal_content = false
  auto_detect_remappings = false
  remappings = [
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable-5.0.2/contracts/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts-5.0.2/contracts/",
    "forge-std/=lib/forge-std/src/",
    "openzeppelin-foundry-upgrades/=lib/openzeppelin-foundry-upgrades/src/",
    "solidity-stringutils/=lib/openzeppelin-foundry-upgrades/lib/solidity-stringutils/",
  ]

[profile.ci]
  fuzz = { runs = 10_000 }
  verbosity = 4

[etherscan]
  arbitrum = { key = "${API_KEY_ARBISCAN}" }
  avalanche = { key = "${API_KEY_SNOWTRACE}" }
  base = { key = "${API_KEY_BASESCAN}" }
  gnosis_chain = { key = "${API_KEY_GNOSISSCAN}" }
  goerli = { key = "${API_KEY_ETHERSCAN}" }
  mainnet = { key = "${API_KEY_ETHERSCAN}" }
  optimism = { key = "${API_KEY_OPTIMISTIC_ETHERSCAN}" }
  polygon = { key = "${API_KEY_POLYGONSCAN}" }
  sepolia = { key = "${API_KEY_ETHERSCAN}" }

[lint]
  exclude_lints = [
    "mixed-case-function",       # Deployed ABIs — cannot rename
    "mixed-case-variable",       # Deployed storage variables — cannot rename
    "asm-keccak256",             # EIP-712 signatures need abi.encodePacked + keccak256
    "erc20-unchecked-transfer",  # Only triggers in test files (PCECommunityToken.transfer always returns true)
    "pascal-case-struct",        # Legacy polygon lib
    "unwrapped-modifier-logic",  # Legacy polygon lib
  ]

[fmt]
  # Preserve the exact Etherscan-verified production source (core commit 2bf6ada).
  ignore = ["governor-mainnet/PCEGovernor.sol"]
  bracket_spacing = true
  int_types = "long"
  line_length = 120
  multiline_func_header = "all"
  number_underscore = "thousands"
  quote_style = "double"
  tab_width = 4
  wrap_comments = true

[rpc_endpoints]
  arbitrum = "https://arbitrum-mainnet.infura.io/v3/${API_KEY_INFURA}"
  avalanche = "https://avalanche-mainnet.infura.io/v3/${API_KEY_INFURA}"
  base = "https://mainnet.base.org"
  bnb_smart_chain = "https://bsc-dataseed.binance.org"
  gnosis_chain = "https://rpc.gnosischain.com"
  goerli = "https://goerli.infura.io/v3/${API_KEY_INFURA}"
  localhost = "http://localhost:8545"
  mainnet = "https://mainnet.infura.io/v3/${API_KEY_INFURA}"
  optimism = "https://optimism-mainnet.infura.io/v3/${API_KEY_INFURA}"
  polygon = "https://polygon-mainnet.infura.io/v3/${API_KEY_INFURA}"
  amoy = "https://polygon-amoy.infura.io/v3/${API_KEY_INFURA}"
  sepolia = "https://sepolia.infura.io/v3/${API_KEY_INFURA}"
